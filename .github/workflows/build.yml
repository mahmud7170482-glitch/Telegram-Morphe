name: Build Telegram with Vault (Morphe)

# Builds a small Morphe patch bundle (custom-patches/) on top of the official MorpheApp/morphe-patches source,
# then patches the official Telegram APK with it. The patch adds a PIN-protected "Vault" screen (second launcher
# icon) where accounts can be hidden from Telegram's side menu and opened again.
on:
  workflow_dispatch:
    inputs:
      upload_release:
        description: 'Publish the APK as a GitHub Release (uncheck to build an artifact only)'
        required: true
        default: true
        type: boolean
      patches_ref:
        description: 'Tag of MorpheApp/morphe-patches to build on (the overlay was written for v2.1.0)'
        required: false
        default: 'v2.1.0'
        type: string
      apk_url:
        description: 'Direct link to a Telegram APK (empty = the official telegram.org download)'
        required: false
        type: string
      enable_patches:
        description: 'Extra patches to turn on, comma separated, exact names'
        required: false
        type: string
      exclude_patches:
        description: 'Patches to turn off, comma separated, exact names'
        required: false
        type: string

concurrency:
  group: build-telegram
  cancel-in-progress: false

permissions:
  contents: write
  packages: read   # needed to build the Morphe patches from source

jobs:
  build:
    name: Patch Telegram
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PATCHES_REF: ${{ inputs.patches_ref || 'v2.1.0' }}
      HAS_KEYSTORE_SECRET: ${{ secrets.KEYSTORE_BASE64 != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Android only updates an app with an APK signed by the SAME key, so the key must stay the same:
      #   1. the KEYSTORE_BASE64 secret, if you added one (best), otherwise
      #   2. a key generated once and kept in the Actions cache.
      - name: Restore generated keystore (only when no secret is set)
        if: env.HAS_KEYSTORE_SECRET != 'true'
        uses: actions/cache@v4
        with:
          path: .ci-keystore
          key: signing-keystore-telegram-v1

      - name: Prepare signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p .ci-keystore
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > .ci-keystore/release.keystore
            echo "Using the keystore from the KEYSTORE_BASE64 secret."
          elif [ -s .ci-keystore/release.keystore ]; then
            echo "Using the keystore restored from the Actions cache."
          else
            echo "::warning::No KEYSTORE_BASE64 secret and no cached keystore: generating a new signing key."
            echo "::warning::An APK signed with a different key cannot be installed over an older one (uninstall first)."
            keytool -genkeypair -keystore .ci-keystore/release.keystore -storetype PKCS12 \
              -alias key -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android -dname "CN=Telegram Vault"
          fi
          test -s .ci-keystore/release.keystore

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Get the Morphe CLI
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/resolve_assets.py --out-dir tools --skip-patches

      # ------------------------------------------------------------------
      # Build the Morphe patches: official source + our overlay (custom-patches/)
      # ------------------------------------------------------------------
      - name: Get the Morphe patches source
        uses: actions/checkout@v4
        with:
          repository: MorpheApp/morphe-patches
          ref: ${{ env.PATCHES_REF }}
          path: morphe-patches-src

      - name: Add the Telegram vault patch to the source
        run: |
          test -d morphe-patches-src/extensions/all || { echo "::error::morphe-patches $PATCHES_REF has no extensions/all folder; its layout changed. Use patches_ref v2.1.0."; exit 1; }
          test -d morphe-patches-src/patches/src/main/kotlin/app/morphe/patches/all || { echo "::error::morphe-patches $PATCHES_REF has no patches/.../all folder; its layout changed. Use patches_ref v2.1.0."; exit 1; }
          cp -r custom-patches/* morphe-patches-src/
          echo "Added:"
          find custom-patches -type f | sed 's#^custom-patches/#  #'

      - name: Cache Gradle
        uses: burrunan/gradle-cache-action@v3
        with:
          build-root-directory: morphe-patches-src

      - name: Build the patches
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd morphe-patches-src
          chmod +x gradlew
          ./gradlew :patches:buildAndroid --no-daemon

      - name: Check the built patches
        run: |
          MPP=$(find morphe-patches-src/patches/build/libs -name 'patches-*.mpp' \
                  ! -name '*-sources.mpp' ! -name '*-javadoc.mpp' | sort -V | tail -n 1)
          if [ -z "$MPP" ]; then echo "::error::The build produced no patches-*.mpp file."; exit 1; fi
          cp "$MPP" tools/patches-vault.mpp
          echo "Patches file: $MPP"
          echo "== Telegram files inside the bundle:"
          unzip -l tools/patches-vault.mpp | grep -i "telegram" || echo "(none found)"
          echo "== Is the patch registered?"
          java -jar tools/morphe-cli.jar list-patches --patches tools/patches-vault.mpp 2>&1 | tee patch-list-all.txt | grep -i "Telegram vault" \
            || { echo "::error::The 'Telegram vault' patch is not in the built bundle."; exit 1; }

      # ------------------------------------------------------------------
      # Get Telegram
      # ------------------------------------------------------------------
      - name: Download Telegram
        id: apk
        env:
          APK_URL: ${{ inputs.apk_url }}
        run: |
          URL="${APK_URL:-https://telegram.org/dl/android/apk}"
          echo "Downloading $URL"
          curl -fL --retry 3 --retry-delay 5 -A "Mozilla/5.0" -o telegram.apk "$URL"
          python3 - <<'PY'
          import sys, zipfile
          p = "telegram.apk"
          if not zipfile.is_zipfile(p):
              print("::error::The download is not an APK (an error page?).")
              sys.exit(1)
          names = zipfile.ZipFile(p).namelist()
          if "AndroidManifest.xml" not in names:
              print("::error::This file has no AndroidManifest.xml (a bundle, not a plain APK?).")
              sys.exit(1)
          PY
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          "$BT/aapt" dump badging telegram.apk | grep -E "^package:|^sdkVersion|^targetSdkVersion|^native-code" || true
          VERSION=$("$BT/aapt" dump badging telegram.apk | grep -oP "versionName='\K[^']+" | head -n 1)
          echo "version=${VERSION:-unknown}" >> "$GITHUB_OUTPUT"
          ls -lh telegram.apk
          echo "== signature of the original"
          "$BT/apksigner" verify --print-certs telegram.apk | head -n 6

      # ------------------------------------------------------------------
      # Patch + sign + repair
      # ------------------------------------------------------------------
      - name: Patch Telegram
        env:
          VERSION: ${{ steps.apk.outputs.version }}
          ENABLE: ${{ inputs.enable_patches }}
          EXCLUDE: ${{ inputs.exclude_patches }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            KS_PASS="${KEYSTORE_PASSWORD:-android}"
            KS_ALIAS="${KEYSTORE_ALIAS:-key}"
          else
            KS_PASS="android"
            KS_ALIAS="key"
          fi

          OUT="Telegram-Vault-v${VERSION}.apk"
          echo "OUT_APK=$OUT" >> "$GITHUB_ENV"

          ARGS=(patch -p tools/patches-vault.mpp
                -e "Telegram vault"
                -o "$OUT" -r result.json
                --keystore .ci-keystore/release.keystore
                --keystore-password "$KS_PASS"
                --keystore-entry-alias "$KS_ALIAS"
                --keystore-entry-password "$KS_PASS")

          add_list() {  # add_list FLAG "a, b, c"
            local flag="$1" raw="$2" item
            IFS=',' read -ra items <<< "$raw"
            for item in "${items[@]}"; do
              item="$(echo "$item" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
              if [ -n "$item" ]; then ARGS+=("$flag" "$item"); fi
            done
          }
          add_list -e "$ENABLE"
          add_list -d "$EXCLUDE"

          java -Xmx3g -jar tools/morphe-cli.jar "${ARGS[@]}" telegram.apk
          test -s "$OUT" || { echo "::error::Patching finished but $OUT was not created."; exit 1; }

      - name: Make the patched APK installable (repair, align, re-sign, check)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          if [ -n "$KEYSTORE_BASE64" ]; then
            export KS_PASS="${KEYSTORE_PASSWORD:-android}"
            KS_ALIAS="${KEYSTORE_ALIAS:-key}"
          else
            export KS_PASS="android"
            KS_ALIAS="key"
          fi

          echo "== Before"
          unzip -tq "$OUT_APK" | tail -n 1
          if "$BT/zipalign" -c 4 "$OUT_APK"; then echo "zip alignment: OK"; else echo "zip alignment: NOT aligned (will be fixed)"; fi

          python3 .github/scripts/fix_apk.py "$OUT_APK" fixed.apk
          if "$BT/zipalign" -h 2>&1 | grep -q -- "-P"; then ALIGN="-P 16"; else ALIGN="-p"; fi
          "$BT/zipalign" -f $ALIGN 4 fixed.apk aligned.apk
          "$BT/apksigner" sign --ks .ci-keystore/release.keystore \
            --ks-pass env:KS_PASS --key-pass env:KS_PASS --ks-key-alias "$KS_ALIAS" \
            --out final.apk aligned.apk
          mv -f final.apk "$OUT_APK"
          rm -f fixed.apk aligned.apk final.apk.idsig "$OUT_APK.idsig"

          echo "== After"
          unzip -tq "$OUT_APK" | tail -n 1
          "$BT/zipalign" -c $ALIGN 4 "$OUT_APK" && echo "zip alignment: OK"
          "$BT/apksigner" verify --verbose --print-certs "$OUT_APK" | head -n 8
          "$BT/aapt" dump badging "$OUT_APK" | grep -E "^package:|^sdkVersion|^targetSdkVersion|^native-code" || true
          echo "== Vault activity in the patched manifest:"
          "$BT/aapt" dump xmltree "$OUT_APK" AndroidManifest.xml | grep -n "VaultActivity" || echo "::warning::VaultActivity not found in the manifest"
          ls -lh "$OUT_APK"

      - name: Upload the APK as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.OUT_APK }}
          path: ${{ env.OUT_APK }}
          if-no-files-found: error

      - name: Publish the release
        if: github.event_name != 'workflow_dispatch' || inputs.upload_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.apk.outputs.version }}
        run: |
          TAG="telegram-v${VERSION}-vault"
          {
            echo "**Telegram ${VERSION}** with the **Vault** patch (PIN-protected hidden accounts)."
            echo
            echo "Open the second launcher icon **Vault** to set a PIN and hide or unhide accounts."
            echo "Read the README first: notifications of hidden accounts still appear, and test with a spare account."
          } > release_notes.md

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$OUT_APK" --clobber
            gh release edit "$TAG" --notes-file release_notes.md
          else
            gh release create "$TAG" "$OUT_APK" --title "Telegram ${VERSION} + Vault" --notes-file release_notes.md
          fi

          gh release list --limit 50 --json tagName --jq '[.[] | select(.tagName | startswith("telegram-v"))] | .[3:][].tagName' | while read -r OLD; do
            if [ -n "$OLD" ] && [ "$OLD" != "$TAG" ]; then
              gh release delete "$OLD" --yes --cleanup-tag || true
            fi
          done

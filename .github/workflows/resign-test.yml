name: Re-sign Telegram WITHOUT any patch (login test)

# Downloads the official Telegram APK and only re-signs it with your key. No patch, no Vault, no extension.
# If this copy cannot log in but the official one can, re-signing is the problem (not the patch).
# If this copy logs in fine but the patched build does not, the patch is the problem.
on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: 'Direct link to a Telegram APK (empty = the official telegram.org download)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  resign:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HAS_KEYSTORE_SECRET: ${{ secrets.KEYSTORE_BASE64 != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore generated keystore (only when no secret is set)
        if: env.HAS_KEYSTORE_SECRET != 'true'
        uses: actions/cache@v4
        with:
          path: .ci-keystore
          key: signing-keystore-telegram-v1

      - name: Prepare signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p .ci-keystore
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > .ci-keystore/release.keystore
          elif [ ! -s .ci-keystore/release.keystore ]; then
            keytool -genkeypair -keystore .ci-keystore/release.keystore -storetype PKCS12 \
              -alias key -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android -dname "CN=Telegram Vault"
          fi
          test -s .ci-keystore/release.keystore

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Download Telegram
        env:
          APK_URL: ${{ inputs.apk_url }}
        run: |
          URL="${APK_URL:-https://telegram.org/dl/android/apk}"
          curl -fL --retry 3 --retry-delay 5 -A "Mozilla/5.0" -o telegram.apk "$URL"
          ls -lh telegram.apk

      - name: Re-sign (nothing else changes)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          if [ -n "$KEYSTORE_BASE64" ]; then
            export KS_PASS="${KEYSTORE_PASSWORD:-android}"; KS_ALIAS="${KEYSTORE_ALIAS:-key}"
          else
            export KS_PASS="android"; KS_ALIAS="key"
          fi
          VERSION=$("$BT/aapt" dump badging telegram.apk | grep -oP "versionName='\K[^']+" | head -n 1)
          OUT="Telegram-resigned-only-v${VERSION:-unknown}.apk"
          echo "OUT_APK=$OUT" >> "$GITHUB_ENV"
          if "$BT/zipalign" -h 2>&1 | grep -q -- "-P"; then ALIGN="-P 16"; else ALIGN="-p"; fi
          "$BT/zipalign" -f $ALIGN 4 telegram.apk aligned.apk
          "$BT/apksigner" sign --ks .ci-keystore/release.keystore \
            --ks-pass env:KS_PASS --key-pass env:KS_PASS --ks-key-alias "$KS_ALIAS" \
            --out "$OUT" aligned.apk
          rm -f "$OUT.idsig"
          "$BT/apksigner" verify --print-certs "$OUT" | head -n 5
          ls -lh "$OUT"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.OUT_APK }}
          path: ${{ env.OUT_APK }}
          if-no-files-found: error
